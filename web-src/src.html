<style>
/* Layout: slim left rail of sections on desktop, scrolling tab strip on phones; one working panel to the right.
   Fog-grey ground, copper accent for actions, frost blue for data highlights; each biome keeps its own colour as a dot. */
:root{
  --bg:#ECEFEF; --surface:#F8FAFA; --surface2:#E2E8E9; --ink:#16262B; --muted:#586B71; --line:#CFD8DA;
  --accent:#A9501B; --accent-ink:#FFFFFF; --frost:#1F6A8C; --good:#2E7D4F; --warn:#9A6A00;
  --w-storm:#F1C9C2; --w-rain:#C5D8F2; --w-snow:#E1EDF8; --w-mist:#DADFE0; --w-clear:#F7E9B8; --w-other:#E4DFF0; --w-ash:#D3D3D3;
  --font-d:'Almendra','Palatino Linotype',Georgia,serif; --font-b:'Alegreya Sans',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F191D; --surface:#16242A; --surface2:#1E3138; --ink:#E4EBEB; --muted:#8EA3A9; --line:#2A3F46;
  --accent:#E3924F; --accent-ink:#1A0F07; --frost:#6DB6D6; --good:#6CC08E; --warn:#E0B050;
  --w-storm:#5A2E2A; --w-rain:#243F63; --w-snow:#2F4457; --w-mist:#394549; --w-clear:#5B4D1C; --w-other:#3C3555; --w-ash:#4E4E4E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F191D; --surface:#16242A; --surface2:#1E3138; --ink:#E4EBEB; --muted:#8EA3A9; --line:#2A3F46;
  --accent:#E3924F; --accent-ink:#1A0F07; --frost:#6DB6D6; --good:#6CC08E; --warn:#E0B050;
  --w-storm:#5A2E2A; --w-rain:#243F63; --w-snow:#2F4457; --w-mist:#394549; --w-clear:#5B4D1C; --w-other:#3C3555; --w-ash:#4E4E4E; color-scheme:dark}

/* biome / category theming: --bc is the page colour, everything else is mixed from it */
:root[data-themed]{--accent:color-mix(in srgb,var(--bc) 62%,#000);--frost:color-mix(in srgb,var(--bc) 55%,#10303f);
  --bg:color-mix(in srgb,var(--bc) 11%,#ECEFEF);--surface:color-mix(in srgb,var(--bc) 5%,#F8FAFA);--surface2:color-mix(in srgb,var(--bc) 16%,#E2E8E9);--line:color-mix(in srgb,var(--bc) 24%,#CFD8DA)}
@media (prefers-color-scheme:dark){:root[data-themed]:not([data-theme="light"]){--accent:color-mix(in srgb,var(--bc) 72%,#fff);--frost:color-mix(in srgb,var(--bc) 60%,#fff);
  --bg:color-mix(in srgb,var(--bc) 14%,#0C1316);--surface:color-mix(in srgb,var(--bc) 12%,#141F24);--surface2:color-mix(in srgb,var(--bc) 20%,#1B2B31);--line:color-mix(in srgb,var(--bc) 30%,#22343A)}}
:root[data-theme="dark"][data-themed]{--accent:color-mix(in srgb,var(--bc) 72%,#fff);--frost:color-mix(in srgb,var(--bc) 60%,#fff);
  --bg:color-mix(in srgb,var(--bc) 14%,#0C1316);--surface:color-mix(in srgb,var(--bc) 12%,#141F24);--surface2:color-mix(in srgb,var(--bc) 20%,#1B2B31);--line:color-mix(in srgb,var(--bc) 30%,#22343A)}
body,.hero,.stat>div,.fxc,.tile,.btn{transition:background-color .35s,border-color .35s}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:1.95rem} h3{font-size:1.3rem}
a{color:var(--frost)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 0;max-width:1280px;margin:0 auto}
.brand{font-family:var(--font-d);font-size:1.7rem;font-weight:700;letter-spacing:.04em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--accent)}
.brand{display:inline-flex;align-items:center;gap:10px}.vmark{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:520px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.hits{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.hits button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.hits button:hover,.hits button:focus-visible{background:var(--surface2)}
.hits small{color:var(--muted);margin-left:auto;white-space:nowrap}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;align-items:start}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}

.nav a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--accent);color:var(--accent-ink);font-weight:700}
main{min-width:0}
.lede{color:var(--muted);margin:4px 0 16px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.bar input,.bar select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%;text-transform:none;font-size:1rem;color:var(--ink)}
.bar input[type=range]{padding:0;accent-color:var(--accent);width:180px}
.val{font-family:var(--font-m);color:var(--ink);font-size:.9rem;text-transform:none;letter-spacing:0}
.count{color:var(--muted);font-size:.9rem;margin:6px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface2);font:700 .78rem var(--font-b);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
th button{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
td.n,th.n{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tr.open td{background:var(--surface2)}
td.wrap{min-width:200px;max-width:420px}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:7px;vertical-align:baseline}

/* ---- art direction: dark inventory slots for icons, painted biome tiles with a label band ---- */
:root{--slot-a:#4A4036;--slot-b:#211B16;--slot-edge:#0B0907;--tile-ink:#FFFFFF;--tile-shade:rgba(8,6,4,.78);--tile-ring:#F2C46B}
.ico{width:32px;height:32px;display:block;flex:none;overflow:visible}
.ico.sm{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:6px}
.slot{flex:none;width:42px;height:42px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,var(--slot-a),var(--slot-b) 78%);border:1px solid var(--slot-edge);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.25)}
.slot .ico{width:32px;height:32px}
.gh[data-gk]{cursor:pointer;user-select:none;position:relative;padding-right:38px}
.gh[data-gk]:hover{border-color:color-mix(in srgb,var(--line) 50%,var(--muted))}
.gh[data-gk]:focus-visible{outline:2px solid var(--tile-ring,#C9A06A);outline-offset:2px}
.gchev{position:absolute;right:12px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.gh[aria-expanded=false] .gchev{transform:rotate(-90deg)}
.grp:has(>.gh[aria-expanded=false])>:not(.gh){display:none}
.gh[aria-expanded=false] p{display:none}
@media (prefers-reduced-motion:reduce){.gchev{transition:none}}
.gh h3{display:flex;align-items:center;gap:10px}.gh .slot{width:34px;height:34px;border-radius:7px}.gh .slot .ico{width:26px;height:26px}
.bbadge{flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;display:inline-block;border:2px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.25)}.bbadge .scn{width:100%;height:100%;display:block}
.sech{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
/* biome picture tiles */
.btiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btile,.ptile{position:relative;display:block;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.35);padding:0;cursor:pointer;background:#16120E;color:var(--tile-ink);text-decoration:none;font:inherit;text-align:center;isolation:isolate}
.btile.wide{grid-column:1/-1;aspect-ratio:2.05/1}
.btile>.scn,.ptile>.scn{position:absolute;inset:0;width:100%;height:100%;z-index:-1;transition:transform .35s ease}
.btile:hover>.scn,.ptile:hover>.scn{transform:scale(1.05)}
.bti,.pti{position:absolute;left:50%;top:44%;width:42%;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.btile.wide .bti:not(.bmed){width:21%}
.bti .ico,.pti .ico{width:100%;height:auto;aspect-ratio:1}
.btl,.ptl{position:absolute;inset:auto 0 0;padding:28px 10px 11px;background:linear-gradient(transparent,var(--tile-shade) 62%);display:flex;flex-direction:column;align-items:center;gap:1px}
.btl b,.ptl b{font:700 1.08rem var(--font-b);letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.btl small,.ptl small{font-size:.78rem;opacity:.85;line-height:1.25;max-width:95%}
.bmed{width:auto;height:50%;top:39%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:6%;box-sizing:border-box;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--bc) 30%,#16120E) 0%,rgba(22,18,14,.88) 70%);box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 70%,#1C1612),0 0 18px color-mix(in srgb,var(--bc) 45%,transparent),inset 0 0 12px rgba(0,0,0,.6);transition:transform .25s ease}
.bmed .ico{position:absolute;left:11%;top:11%;width:78%!important;height:78%!important}
.btile:hover .bmed{transform:translate(-50%,-50%) scale(1.07)}
.btile.wide .bmed,.btile.wide .bti.bmed{width:auto}
@media (prefers-reduced-motion:reduce){.btile:hover .bmed{transform:translate(-50%,-50%)}}
.btile[aria-pressed=true]{outline:3px solid var(--tile-ring);outline-offset:-3px}

  while(t<end){const p=Math.floor(t/666),roll=wxRoll(p);out.push([dn,i++===0?'Dawn (carried over)':wxTime(t),...BIO.map(b=>{const r=wxName(b,p,roll);return WXN[r]||r})]);t=t<2040?2040:(p+1)*666}
  return out}
function wxWind(time){let angle=0,inten=.5;for(const o of [1,2,4,8]){const p=Math.floor(time/(125*8/o));let a=p>>>0;let b=(Math.imul(a,1812433253)+1)>>>0,c=(Math.imul(b,1812433253)+1)>>>0,d=(Math.imul(c,1812433253)+1)>>>0;
    const nx=()=>{const t1=(a^(a<<11))>>>0,t2=(t1^(t1>>>8))>>>0;a=b;b=c;c=d;d=(d^(d>>>19)^t2)>>>0;return d};
    const rnd=()=>((nx()<<9)>>>0)/4294967295;angle+=rnd()*2*Math.PI/o;inten+=(rnd()-.5)/o}
  inten=Math.min(1,Math.max(0,inten));let ang=angle*180/Math.PI;while(ang>180)ang-=360;let fr=ang+180;while(fr>180)fr-=360;return [ang,fr,inten]}
function wxCompass(v){if(v<-22.5)v+=360;let mn=-22.5,mx=22.5;for(const n of ['N','NE','E','SE','S','SW','W','NW']){if(mn<v&&v<=mx)return n;mn+=45;mx+=45}return 'ERR'}
function wxWindDay(dn,BIO){const start=Math.max(2040-125,dn*1800),end=(dn+1)*1800;let t=start;const out=[];
  while(t<end){const wp=Math.floor(t/125),[ang,fr,inten]=wxWind(t),p=Math.floor(t/666),roll=wxRoll(p);
    const bio=BIO.map(b=>{const w=wxName(b,p,roll),[lo,hi]=WXW[w];return lo+(hi-lo)*inten});
    out.push([dn,out.length===0?'Dawn':wxTime(t),wxCompass(fr)+' ('+Math.round(fr)+'°)',wxCompass(ang)+' ('+Math.round(ang)+'°)',inten,...bio]);t=t<2040?2040:Math.min((wp+1)*125,(p+1)*666)}

const MAXDAY=1000000;
const tmin=t=>{const m=/^(\d+):(\d+)$/.exec(t);return m?+m[1]*60+ +m[2]:0};

    if(st.focus){const o=$('#grid .it.on');if(o)o.scrollIntoView({block:'center'});st.focus=false}

    <div><small>Stamina per attack</small><b>${fmt((1-C.stamGain*st.skill)*100,0)}%</b></div>
    ${blk?`<div><small>Block power</small><b>${fmt(blk*(1+C.blockGain*st.skill),1)}</b></div>`:''}</div>
    ${st.qual>w[19]?`<p class="count">This weapon tops out at Q${w[19]}, so the numbers use Q${q}.</p>`:''}
    <h3 style="margin-top:20px">Average hit by quality and skill</h3><div class="tw" style="margin-top:8px"><table class="heat"><thead><tr><th>Quality</th>${ss.map(s=>`<th class="n">Skill ${s}</th>`).join('')}</tr></thead><tbody>${qs.map(x=>`<tr><th>Q${x}</th>${ss.map(s=>{const v=dmgAt(w,x)*(wk(s)+sg(s))/2;const a=Math.round(8+40*v/max);return `<td style="background:color-mix(in srgb,var(--frost) ${a}%,transparent)">${fmt(v,1)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note" style="color:var(--muted)">Hit shares are the sheet's working assumptions: the weakest hit is ${Math.round(C.weakBase*100)}% of listed damage at skill 0 and the strongest is ${Math.round(C.strongBase*100)}%, both rising ${(C.weakGain*100).toFixed(1)}% per skill level. Enemy resistances are not applied. The Forge of Potential succeeds ${Math.round(C.forgeChance*100)}% of the time, so expect to lose some items on the way to Q${C.forgeMax}.</p>`;

views.weather=function(m){
  const st=S.weather=S.weather||{biome:store.get('biome','Meadows'),day:store.get('day',7)};
  m.innerHTML=`<h2>Weather &amp; wind</h2><p class="lede">The game seeds weather from world time, so this forecast is the same in every world. Day 1 is the first morning.</p>
  <div class="bar">${selectHtml('b','Biome',BIO,st.biome).replace('<option value="">All</option>','')}
  <label>Day<input id="d" type="number" min="1" max="1000000" value="${st.day}" style="width:120px"></label>
  <button class="btn" id="pv">◀ Previous day</button><button class="btn" id="nx">Next day ▶</button></div><div id="out"></div>`;
  function draw(){
    const day=Math.max(1,Math.min(MAXDAY,Math.floor(+st.day||1))), b=BIO.indexOf(st.biome);
    store.set('day',day); store.set('biome',st.biome);
    const ws=wxSchedDay(day,BIO), wd=wxWindDay(day,BIO);
    const w=wd.map(r=>r[5+b]), avg=w.reduce((a,c)=>a+c,0)/(w.length||1), pk=Math.max(...w), lo=Math.min(...w);
    // wind sparkline
    const W_=640,H_=90,pad=24; const pts=w.map((v,i)=>[pad+i*(W_-2*pad)/Math.max(1,w.length-1),H_-10-v*(H_-26)]);
    const spark=w.length?`<svg class="spark" viewBox="0 0 ${W_} ${H_+14}" role="img" aria-label="Wind strength through day ${day} in ${esc(st.biome)}"><line x1="${pad}" y1="${H_-10}" x2="${W_-pad}" y2="${H_-10}" stroke="var(--line)"/><line x1="${pad}" y1="${H_-10-(H_-26)}" x2="${W_-pad}" y2="${H_-10-(H_-26)}" stroke="var(--line)" stroke-dasharray="3 4"/><polyline fill="none" stroke="var(--frost)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/><text x="${pad}" y="${H_+8}">${esc(wd[0][1])}</text><text x="${W_-pad}" y="${H_+8}" text-anchor="end">${esc(wd[wd.length-1][1])}</text><text x="4" y="${H_-10-(H_-26)+4}">100%</text><text x="4" y="${H_-6}">0</text></svg>`:'';
    const odds=D.odds.filter(o=>o[0]===st.biome);
    $('#out').innerHTML=`<div class="stat"><div><small>Day ${day}</small><b style="font-size:1.25rem;font-family:var(--font-b);font-weight:700">${esc(st.biome)}</b></div><div><small>Average wind</small><b class="big">${w.length?fmt(avg*100)+'%':'-'}</b></div><div><small>Peak</small><b>${w.length?fmt(pk*100)+'%':'-'}</b></div><div><small>Calm</small><b>${w.length?fmt(lo*100)+'%':'-'}</b></div></div>
    <h3>Weather rolls</h3><div class="tw" style="margin-top:8px"><table><thead><tr><th>Biome</th>${ws.map(r=>`<th>${esc(String(r[1]).replace(' (carried over)',''))}</th>`).join('')}</tr></thead><tbody>${BIO.map((n,i)=>`<tr ${i===b?'style="outline:2px solid var(--accent);outline-offset:-2px"':''}><td>${dot(n)}${n}</td>${ws.map(r=>`<td>${wchip(r[2+i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note" style="color:var(--muted)">The first column is the weather still running at dawn, carried over from the day before. Swamp, Mistlands and Ashlands keep one fixed weather.</p>
    <h3 style="margin-top:22px">Wind through the day in ${esc(st.biome)}</h3>${spark}
    <h3 style="margin-top:22px">What ${esc(st.biome)} can throw at you</h3><div class="tw" style="margin-top:8px"><table><thead><tr><th>Weather</th><th class="n">Chance</th><th class="n">Wind</th><th>Effects</th></tr></thead><tbody>${odds.map(o=>`<tr><td>${wchip(o[1])}</td><td class="n">${esc(o[2])}</td><td class="n">${esc(o[3])}</td><td>${esc(o[4])}</td></tr>`).join('')}</tbody></table></div>`;
    m.querySelector('#d').value=day; st.day=day;
  }
  m.querySelector('#b').onchange=e=>{st.biome=e.target.value;draw()};
  m.querySelector('#d').oninput=e=>{if(e.target.value!==''){st.day=+e.target.value;draw()}};
  m.querySelector('#pv').onclick=()=>{st.day=Math.max(1,st.day-1);draw()};
  m.querySelector('#nx').onclick=()=>{st.day=Math.min(MAXDAY,st.day+1);draw()};
  draw();
};

views.loadouts=function(m){
  const st=S.loadouts=Object.assign({b:store.get('biome','Meadows'),qual:4},S.loadouts||{}); st.qual=snapQ(st.qual);
  m.innerHTML=`<h2>Loadouts</h2><p class="lede">Build up to three of your own loadouts, then browse each armor set with the weapons that suit it. Everything is shown at the quality you choose.</p>
  <div class="bar">${qpick(st.qual)}</div>
  <section class="grp myl">${grpHead('Your loadouts','Up to 3, saved on this device','','',slot('chest','#C9A06A','#6B4A33'))}<div id="mine" class="mycards"></div></section>
  <section class="grp">${grpHead('Suggested by biome','Each set with the weapons that suit it','','',slot('helmet','#9AA6B2'))}<div class="bar">${selectHtml('fb','Biome',BIO,st.b).replace('<option value="">All</option>','')}</div><div class="cards" id="cards"></div></section>`;
  const order=['Helmet','Chest','Legs','Cape'];
  function draw(){
    const sets=[]; A.filter(a=>a[0]===st.b).forEach(a=>{let s=sets.find(x=>x.name===a[1]); if(!s){s={name:a[1],type:a[2],armor:[],weapons:[]};sets.push(s)} s.armor.push(a)});
    W.filter(w=>w[0]===st.b).forEach(w=>{let s=sets.find(x=>x.name===w[1]); if(!s){s={name:w[1]==='Any'?'No armor':w[1],type:'',armor:[],weapons:[]};sets.push(s)} s.weapons.push(w)});
    $('#cards').innerHTML=sets.map(s=>{
      const ps=s.armor.slice().sort((a,b)=>order.indexOf(a[3])-order.indexOf(b[3]));
      const tot=ps.filter(p=>p[3]!=='Cape').reduce((t,p)=>t+armAt(p,st.qual),0);
      const wp=s.weapons.slice().sort((a,b)=>String(a[2]).localeCompare(String(b[2]))||dmgAt(b,st.qual)-dmgAt(a,st.qual));
      return `<article class="card"><h3>${dot(st.b)}${esc(s.name)}${tot?`<span class="tot" title="Armor without cape">${fmt(tot,1)} armor</span>`:''}</h3>${s.type?`<small style="color:var(--muted)">${esc(s.type)}</small>`:''}
      ${ps.length?`<ul>${ps.map(p=>`<li><span>${ico(...armorIcon(p),"sm")}<a href="#armor" data-open="armor|${esc(p[4])}" class="il">${esc(p[4])}</a></span><span class="m">${esc(p[3])}</span><span class="mono">${fmt(armAt(p,st.qual),1)}</span></li>`).join('')}</ul>`:''}
      ${wp.length?`<ul>${wp.map(w=>`<li><span>${ico(...weaponIcon(w),"sm")}<a href="#weapons" data-open="weapons|${esc(w[3])}" class="il">${esc(w[3])}</a></span><span class="m">${esc(w[2])}</span><span class="mono">${w[2]==='Shield'||w[2]==='Tower Shield'?'block '+fmt(blockAt(w,st.qual),0):fmt(dmgAt(w,st.qual),0)}</span></li>`).join('')}</ul>`:'<p>No weapons listed.</p>'}</article>`}).join('')||'<div class="empty">Nothing listed here.</div>';
  }
  m.querySelector('#fb').onchange=e=>{st.b=e.target.value;draw()};
  const SLOTS=[['Helmet','Helmet'],['Chest','Chest'],['Legs','Legs'],['Cape','Cape'],['w1','Main weapon'],['w2','Second weapon'],['sh','Shield']];
  const isS=w=>w[2]==='Shield'||w[2]==='Tower Shield';
  const opts=(k,val)=>{const pool=k==='sh'?W.filter(isS):k[0]==='w'?W.filter(w=>!isS(w)):A.filter(a=>a[3]===k);const nm=x=>k.length<3?x[3]:x[4];
    return `<option value="">None</option>`+BIO.map(b=>{const xs=pool.filter(x=>x[0]===b);return xs.length?`<optgroup label="${b}">${xs.map(x=>`<option ${nm(x)===val?'selected':''}>${esc(nm(x))}</option>`).join('')}</optgroup>`:''}).join('')};
  const getL=()=>{const l=store.get('myloads',[]);return Array.isArray(l)?l.slice(0,3):[]};
  const putL=l=>{store.set('myloads',l.slice(0,3));drawMine()};
  function stats(L){const q=st.qual,ar=['Helmet','Chest','Legs','Cape'].map(k=>A.find(a=>a[4]===L[k])).filter(Boolean),ws=['w1','w2','sh'].map(k=>W.find(w=>w[3]===L[k])).filter(Boolean);
    const armor=ar.reduce((t,a)=>t+armAt(a,q),0),weight=ar.reduce((t,a)=>t+(+a[16]||0),0),move=ar.reduce((t,a)=>t+(+a[17]||0),0)+ws.reduce((t,w)=>t+(+w[30]||0),0);
    const bon=[...new Set(ar.map(a=>a[1]))].map(set=>{const need=A.filter(a=>a[1]===set&&a[20]);return need.length&&need.every(n=>ar.includes(n))?{set,txt:need[0][20]}:null}).filter(Boolean);
    return {ar,ws,armor,weight,move,bon}}
  function drawMine(){const L=getL(),ed=st.edit;
    $('#mine').innerHTML=L.map((l,i)=>{const S2=stats(l);
      if(ed===i) return `<article class="card myc editing" data-i="${i}"><label class="nm">Name<input data-f="name" maxlength="40" value="${esc(l.name||'')}"></label>
        <div class="slots">${SLOTS.map(([k,lab])=>`<label>${lab}<select data-f="${k}">${opts(k,l[k])}</select></label>`).join('')}</div>
        <div class="acts"><button type="button" class="btn pri" data-act="done">Done</button></div></article>`;
      return `<article class="card myc" data-i="${i}"><h3>${esc(l.name||'Loadout '+(i+1))}<span class="tot">${fmt(S2.armor,1)} armor</span></h3>
        <small style="color:var(--muted)">Weight ${fmt(S2.weight,1)} · movement ${S2.move?(S2.move>0?'+':'')+Math.round(S2.move*100)+'%':'0%'}</small>
        ${S2.ar.length?`<ul>${S2.ar.map(p=>`<li><span>${ico(...armorIcon(p),"sm")}<a href="#armor" data-open="armor|${esc(p[4])}" class="il">${esc(p[4])}</a></span><span class="m">${esc(p[3])}</span><span class="mono">${fmt(armAt(p,st.qual),1)}</span></li>`).join('')}</ul>`:''}
        ${S2.ws.length?`<ul>${S2.ws.map(w=>`<li><span>${ico(...weaponIcon(w),"sm")}<a href="#weapons" data-open="weapons|${esc(w[3])}" class="il">${esc(w[3])}</a></span><span class="m">${esc(w[2])}</span><span class="mono">${isS(w)?'block '+fmt(blockAt(w,st.qual),0):fmt(dmgAt(w,st.qual),0)}</span></li>`).join('')}</ul>`:''}
        ${!S2.ar.length&&!S2.ws.length?'<p style="color:var(--muted)">Empty. Tap Edit to pick gear.</p>':''}
        ${S2.bon.map(b=>`<p class="bon"><b>${esc(b.set)} set bonus:</b> ${esc(b.txt)}</p>`).join('')}
        <div class="acts"><button type="button" class="btn" data-act="edit">Edit</button><button type="button" class="btn" data-act="del">Delete</button></div></article>`}).join('')
      +(L.length<3?`<button type="button" class="card addl" data-act="add"><span aria-hidden="true">+</span>Add a loadout<small>${3-L.length} of 3 left</small></button>`:'');
  }
  $('#mine').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,c=b.closest('[data-i]'),i=c?+c.dataset.i:-1,L=getL();
    if(a==='add'){if(L.length>=3)return;L.push({name:'Loadout '+(L.length+1)});st.edit=L.length-1;putL(L)}
    else if(a==='edit'){st.edit=i;drawMine()}
    else if(a==='done'){st.edit=null;drawMine()}
    else if(a==='del'){if(b.dataset.sure){L.splice(i,1);st.edit=null;putL(L)}else{b.dataset.sure=1;b.textContent='Tap again to delete';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Delete'}},3000)}}};
  $('#mine').onchange=e=>{const f=e.target.dataset.f;if(!f)return;const c=e.target.closest('[data-i]'),L=getL(),l=L[+c.dataset.i];if(!l)return;if(e.target.value)l[f]=e.target.value;else delete l[f];store.set('myloads',L)};
  $('#mine').oninput=e=>{if(e.target.dataset.f==='name'){const c=e.target.closest('[data-i]'),L=getL();L[+c.dataset.i].name=e.target.value;store.set('myloads',L)}};
  qEvents(m,st,()=>{draw();drawMine()}); draw(); drawMine();
};

const prog={ach:{},tro:{}}; 
function localLoad(){try{const x=store.get('prog',null); if(x){prog.ach=x.ach||{};prog.tro=x.tro||{}}}catch(e){}}
function localSave(){store.set('prog',{ach:prog.ach,tro:prog.tro})}

views.achievements=function(m){
  const st=S.achievements=Object.assign({q:'',show:'all',tab:'ach',ord:'prog',ordT:'biome'},S.achievements||{});
  const SEC=[['Getting started',[9,33,2,35,40,37]],['Bosses and combat',[7,30,4,14,53,45,8,10,18,19,12,51,47,48]],['Gathering, food and fishing',[32,23,29,41,36,15,34,1,6]],['Crafting',[24,22,28]],['Building',[25,21,13,52,27]],['Exploring and sailing',[26,44,49,31,43,46,16,39]],['Hunting and trophies',[38,42,50]],['Deaths and oddities',[17,3,20]],['Aggregate achievements',[11,5]]];
  const ACHPOS={},ACHSEC={};SEC.forEach(([n,ids],si)=>ids.forEach((id,i)=>{ACHPOS[id]=si*100+i;ACHSEC[id]=n}));
  m.innerHTML=`<h2>Achievements &amp; Trophies</h2><p class="lede">Tap a counter to switch between achievements and trophies. Achievements are listed in the order you will most likely unlock them. Tick off what you have done. Your progress is kept for you and comes back next time you open the guide.</p>
  <div class="stat" id="sum" style="grid-template-columns:1fr 1fr"></div>
  <div class="bar"><label>Search<input id="q" type="search" value="${esc(st.q)}"></label>
  <label>Show<select id="sh">${[['all','Everything'],['todo','Still to do'],['done','Done']].map(([k,l])=>`<option value="${k}" ${st.show===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>Order<select id="od"></select></label>
  </div>
  <div class="count" id="syncnote">Saved on this device.</div><div class="tw" id="tw"></div>`;
  function items(){
    const q=st.q.toLowerCase();
    let base=st.tab==='ach'?D.ach.map(a=>({k:'a'+a[0],label:a[1],sub:a[2],note:a[3],grp:null,sec:ACHSEC[a[0]],pos:ACHPOS[a[0]]})):D.trophies.map((t,i)=>({k:'t'+t[0],label:t[0],sub:t[1],note:null,grp:t[1],sec:t[1],pos:BIO.indexOf(t[1])*1000+i}));
    const o=st.tab==='ach'?st.ord:st.ordT;
    if(o==='az'){base=base.slice().sort((a,b)=>a.label.localeCompare(b.label));base.forEach(x=>{x.sec=null})}else{base=base.slice().sort((a,b)=>a.pos-b.pos)}
    const map=st.tab==='ach'?prog.ach:prog.tro;
    return base.filter(x=>(!q||(x.label+' '+(x.sub||'')+' '+(x.note||'')).toLowerCase().includes(q))&&(st.show==='all'||(st.show==='done')===!!map[x.k])).map(x=>Object.assign(x,{on:!!map[x.k]}));
  }
  function sum(){
    const ad=D.ach.filter(a=>prog.ach['a'+a[0]]).length, td=D.trophies.filter(t=>prog.tro['t'+t[0]]).length;
    const bar=(n,t)=>`<span class="pb"><i style="width:${t?100*n/t:0}%"></i></span>`;
    $('#sum').innerHTML=[['ach','Achievements',ad,D.ach.length],['tro','Trophies',td,D.trophies.length]].map(([k,l,n,t])=>`<button type="button" class="sumb" data-tab="${k}" aria-pressed="${st.tab===k}" title="Show ${l.toLowerCase()}"><small>${l}</small><b class="big">${n} / ${t}</b>${bar(n,t)}</button>`).join('');
  }
  function draw(){
    sum(); const list=items(); $('#tw').innerHTML=list.length?`<table><tbody>${list.map((x,i)=>(x.sec&&(i===0||list[i-1].sec!==x.sec)?`<tr class="sec"><th colspan="2">${x.grp?dot(x.grp):''}${esc(x.sec)}</th></tr>`:'')+`<tr><td style="width:44px"><input type="checkbox" id="c-${esc(x.k)}" data-k="${esc(x.k)}" ${x.on?'checked':''} aria-label="Done: ${esc(x.label)}" style="width:20px;height:20px;accent-color:var(--accent)"></td><td><label for="c-${esc(x.k)}" style="cursor:pointer"><b style="font-weight:700">${esc(x.label)}</b>${x.grp?'':''}</label>${x.sub?`<div style="color:var(--muted);font-size:.9rem">${x.grp?dot(x.grp):''}${esc(x.sub)}</div>`:''}${x.note?`<div style="color:var(--muted);font-size:.85rem">${esc(x.note)}</div>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nothing here.</div>';
  }
  m.querySelector('#q').oninput=e=>{st.q=e.target.value;draw()};
  m.querySelector('#sh').onchange=e=>{st.show=e.target.value;draw()};
  m.querySelector('#sum').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b||st.tab===b.dataset.tab)return;st.tab=b.dataset.tab;odFill();draw()};
  const odFill=()=>{const a=st.tab==='ach',o=a?st.ord:st.ordT;m.querySelector('#od').innerHTML=(a?[['prog','Unlock order'],['az','A to Z']]:[['biome','Biome'],['az','A to Z']]).map(([k,l])=>`<option value="${k}" ${o===k?'selected':''}>${l}</option>`).join('')};
  odFill();
  m.querySelector('#od').onchange=e=>{if(st.tab==='ach')st.ord=e.target.value;else st.ordT=e.target.value;draw()};
  $('#tw').onchange=e=>{const c=e.target.closest('[data-k]'); if(!c) return; const map=c.dataset.k[0]==='a'?prog.ach:prog.tro; if(c.checked) map[c.dataset.k]=1; else delete map[c.dataset.k]; flush(); sum(); if(st.show!=='all') setTimeout(draw,150)};
  draw();
};

  m.innerHTML=`<h2>Console commands</h2><p class="lede">Every console command with how to type it. Open the console with F5 after launching the game with the -console option.</p>
  <div class="warn" role="note"><h3>Watch out: commands that flag your save</h3>${D.cmdWarn.map(r=>`<p><b>${esc(r[0])}.</b> ${esc(r[1])}</p>`).join('')}</div>
  <div class="bar"><label>Search<input id="q" type="search" value="${esc(st.q)}"></label>${selectHtml('ft','Type',['Flagged commands'].concat(uniq(D.cmds,0)),st.t)}</div><div class="count" id="cnt"></div><div class="tw" id="tw"></div>
  <h3 style="margin-top:24px">ID lists</h3><div class="tw" style="margin-top:8px"><table><tbody>${D.cmdIds.map(r=>`<tr><td style="white-space:nowrap"><b>${esc(r[0])}</b></td><td class="mono" style="font-size:.85rem">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>
  ${D.cmdNote?`<p class="note" style="color:var(--muted)">${esc(D.cmdNote)}</p>`:''}`;
  function draw(){
    const q=st.q.toLowerCase(), flag=r=>!!r[4], ORD=['Cheat flag','Disables saving','Can wipe structures','Destructive','Use after cheating','Xbox prompt'];
    let rows=D.cmds.filter(r=>(!q||r.some(c=>String(c).toLowerCase().includes(q)))&&(!st.t||(st.t==='Flagged commands'?flag(r):r[0]===st.t)));
    if(st.t==='Flagged commands') rows=rows.slice().sort((a,b)=>(ORD.indexOf(a[4])+100)%100-(ORD.indexOf(b[4])+100)%100);
    $('#cnt').textContent=`${rows.length} of ${D.cmds.length}`;
    $('#tw').innerHTML=rows.length?`<table class="stack"><thead><tr><th>Type</th><th>How to type it</th><th>What it does</th><th>Heads up</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="ct">${esc(r[0])}</td><td><button class="btn mono cp" data-t="${esc(/^(Steam|Key)\b/.test(r[2]||'')?r[1]:(r[2]||r[1]))}" title="Copy to clipboard">${esc(r[2]||r[1])}</button></td><td class="wrap">${esc(r[3])}</td><td class="hu">${r[4]?'<span class="chip">'+esc(r[4])+'</span>':''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nothing matches.</div>';
  }
  m.querySelector('#q').oninput=e=>{st.q=e.target.value;draw()};
  m.querySelector('#ft').onchange=e=>{st.t=e.target.value;draw()};
  $('#tw').onclick=e=>{const b=e.target.closest('.cp'); if(!b) return; const t=b.dataset.t; const done=()=>{const o=b.textContent;b.textContent='Copied';setTimeout(()=>{b.textContent=o},900)};
    try{navigator.clipboard.writeText(t).then(done,()=>sel(b))}catch(x){sel(b)} };
  function sel(b){const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  draw();
};

/* ---------- global search ---------- */

views.index=function(m){
  const st=S.index=S.index||{q:''};
  const cats=[['weapons','Weapons',W.length,'Damage by quality, skill and role'],['armor','Armor',A.length,'Every piece and set'],['creatures','Creatures',D.creatures.length,'HP, weaknesses and drops'],['materials','Materials',D.materials.length,'What to gather and where'],['fish','Fish',D.fish.length,'Every fish, bait and biome'],['food','Food & Brews',D.food.length,'Foods, meads and feasts'],['recipes','Recipes',D.recipes.length,'What each station makes'],['stations','Stations',D.stations.length,'Build costs and upgrades'],['merchants','Merchants',D.merchants.length,'Prices and unlocks'],['vanity','Vanity',D.vanity.length,'Cosmetic clothes and crowns'],['trinkets','Trinkets',D.trinkets.length,'Adrenaline effects'],['gems','Gems',D.gems.filter(g=>g[1]!=null).length,'Socketable weapon gems']];
  m.innerHTML=`<h2>Index</h2><p class="lede">Everything in the guide, by type. Search across all of it here, or open a tile to browse and filter that list.</p>
  <div class="bar"><label style="flex:1;min-width:220px">Search everything<input id="iq" type="search" value="${esc(st.q)}" placeholder="Try &quot;iron&quot;, &quot;troll&quot; or &quot;mead&quot;"></label></div>
  <div class="ptiles" id="itiles"></div><div id="ires"></div>`;
  function draw(){
    const q=st.q.trim().toLowerCase(), hit=q.length>=2?IDX.filter(x=>WIKI.includes(x.v)&&x.l&&String(x.l).toLowerCase().includes(q)):[];
    m.querySelector('#itiles').innerHTML=cats.map(([v,t,n,d])=>{const c=hit.filter(x=>x.v===v).length;
      return `<a class="ptile idx" href="#${v}" data-v="${v}" style="--pc:${CATC[v]};${q.length>=2&&!c?'opacity:.45':''}"><span class="pti">${ico(...(v==='creatures'?['dragon','#C9D9EE']:CATICON[v]))}</span><span class="ptl"><b>${t}</b><small>${q.length>=2?c+' match'+(c===1?'':'es'):n+' · '+d}</small></span></a>`}).join('');
    m.querySelector('#ires').innerHTML=q.length<2?'':hit.length?`<h3 style="margin:22px 0 8px">${hit.length} result${hit.length===1?'':'s'}</h3><div class="hitlist">${hit.slice(0,60).map(x=>`<button data-i="${IDX.indexOf(x)}"><span>${esc(nmTrim(x.l))}</span><small>${esc(x.t)} · ${esc(x.s)}</small></button>`).join('')}</div>${hit.length>60?'<div class="empty">Showing the first 60. Narrow the search.</div>':''}`:'<div class="empty">Nothing matches.</div>';
  }
  m.querySelector('#iq').oninput=e=>{st.q=e.target.value;draw()};
  m.querySelector('#itiles').onclick=e=>{const t=e.target.closest('[data-v]');if(!t)return;e.preventDefault();const v=t.dataset.v,q=st.q.trim();
    go(v,{q:q.length>=2?q:'',f:{},b:'',open:null})};
  m.querySelector('#ires').onclick=e=>{const b=e.target.closest('[data-i]');if(b)openHit(IDX[+b.dataset.i])};
  draw();
};
const IDX=[];
W.forEach(w=>IDX.push({t:'Weapon',l:w[3],s:w[0],v:'weapons',k:'q',w:w[3]}));
A.forEach(a=>{IDX.push({t:'Armor',l:a[4],s:a[0],v:'armor',k:'q',w:a[1]})});
D.creatures.forEach(c=>IDX.push({t:'Creature',l:c[1],s:c[0],v:'creatures',w:c[1]}));
D.materials.forEach(c=>IDX.push({t:'Material',l:c[1],s:c[0],v:'materials',w:c[1]}));D.fish.forEach(c=>IDX.push({t:'Fish',l:c[1],s:c[0]+' · '+c[2],v:'fish',w:c[1]}));
D.food.forEach(c=>IDX.push({t:c[0],l:c[1],s:c[2],v:'food',w:c[1]}));
D.recipes.forEach(c=>IDX.push({t:'Recipe',l:c[2],s:c[0],v:'recipes',w:c[2]}));
D.merchants.forEach(c=>IDX.push({t:c[0],l:c[1],s:c[2]+' coins',v:'merchants',w:c[1]}));
D.trinkets.forEach(c=>IDX.push({t:'Trinket',l:c[0],s:c[1],v:'trinkets',w:c[0]}));
D.stations.forEach(c=>IDX.push({t:'Station',l:c[0],s:c[1],v:'stations',w:c[0]}));D.vanity.forEach(c=>IDX.push({t:'Vanity',l:c[0],s:c[1],v:'vanity',w:c[0]}));D.cmds.forEach(c=>IDX.push({t:'Command',l:c[1],s:c[0],v:'console',w:c[1]}));D.ach.forEach(c=>IDX.push({t:'Achievement',l:c[1],s:c[2]||'',v:'achievements',w:c[1]}));D.trophies.forEach(c=>IDX.push({t:'Trophy',l:c[0],s:c[1],v:'achievements',w:c[0]}));
D.gems.filter(g=>g[1]!=null).forEach(c=>IDX.push({t:'Gem',l:c[0],s:c[2]||'',v:'gems',w:c[0]}));
const gs=$('#gsearch'), hits=$('#hits');
gs.addEventListener('input',()=>{
  const q=gs.value.trim().toLowerCase(); if(q.length<2){hits.hidden=true;return}
  const r=IDX.filter(x=>x.l&&String(x.l).toLowerCase().includes(q)).sort((a,b)=>(String(a.l).toLowerCase().startsWith(q)?0:1)-(String(b.l).toLowerCase().startsWith(q)?0:1)).slice(0,14);
  hits.innerHTML=r.length?r.map((x,i)=>`<button data-i="${IDX.indexOf(x)}"><span>${esc(nmTrim(x.l))}</span><small>${esc(x.t)} · ${esc(x.s)}</small></button>`).join(''):'<div class="empty">No matches.</div>';
  hits.hidden=false;
});
function openHit(x){
  const v=x.v; const st={q:String(x.l),f:{}}; if(v==='weapons'||v==='armor'){st.open=x.l;st.focus=true;st.q='';st.b='';st.t=''} else if(WIKI.includes(v)){st.q='';st.openName=x.l}
  S[v]=Object.assign(S[v]||{},st); if(location.hash==='#'+v) route(); else location.hash=v;}
hits.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(!b) return; const x=IDX[+b.dataset.i]; hits.hidden=true; gs.value=''; openHit(x)});
document.addEventListener('click',e=>{if(!e.target.closest('.search')) hits.hidden=true});
gs.addEventListener('keydown',e=>{if(e.key==='Escape'){hits.hidden=true}});
(function(){
  const btn=$('#mapbtn'),box=$('#mapbox'),SITE='https://valheim-map.world/';
  const link=v=>{v=String(v||'').trim();if(!v)return SITE;if(/^https?:\/\//i.test(v))return v;return SITE+'?seed='+encodeURIComponent(v)};
  function render(){const saved=store.get('mapsaved','');
    box.innerHTML=`<label>World seed or map link<input id="mseed" type="text" value="${esc(saved)}" placeholder="Seed, or paste the full map link" spellcheck="false" autocomplete="off"></label>
    <div class="row2"><button class="btn" id="mopen" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">${saved?'Open my map':'Open map site'} ↗</button><button class="btn" id="msave">Save</button>${saved?'<button class="btn" id="mclr">Clear</button>':''}</div>
    <p>Saved on this device. Pasting the full link from the site is the most reliable way to land on your exact map.</p>`;
    const val=()=>box.querySelector('#mseed').value.trim();
    box.querySelector('#mopen').onclick=()=>{const v=val()||saved;if(v)store.set('mapsaved',v);window.open(link(v),'_blank','noopener');render()};
    box.querySelector('#msave').onclick=()=>{store.set('mapsaved',val());render()};
    const c=box.querySelector('#mclr'); if(c)c.onclick=()=>{store.set('mapsaved','');render()};
    box.querySelector('#mseed').onkeydown=e=>{if(e.key==='Enter')box.querySelector('#mopen').click()};}
  const toggle=o=>{box.hidden=!o;btn.setAttribute('aria-expanded',String(o));if(o){render();box.querySelector('#mseed').focus()}};
  btn.onclick=e=>{e.stopPropagation();toggle(box.hidden)};
  document.addEventListener('click',e=>{if(!box.hidden&&!e.composedPath().includes(box))toggle(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!box.hidden)toggle(false)});
})();

})();
