name: Something isn't working
description: A page, button or the Android app misbehaves
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes: { label: Where, options: [Android app, Web version, Both] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps to reproduce and what you expected. Screenshots help a lot." }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and browser / Android version, placeholder: "e.g. Pixel 8, Android 15 · or Chrome on Windows" }
